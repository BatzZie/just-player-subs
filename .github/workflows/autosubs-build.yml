name: Just Player Subs build

# Fork-specific workflow. Upstream workflows only run on master and v0.* tags.
on:
  push:
    branches-ignore: [master]
    tags: ['subs-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${RUNNER_TEMP}/keystore.jks

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleLatestUniversalRelease
          -Pandroid.injected.signing.store.file=${RUNNER_TEMP}/keystore.jks
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}
          -Pandroid.injected.signing.key.alias=key
          -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: just-player-subs-apk
          path: app/build/outputs/apk/latestUniversal/release/*.apk

      # Rolling pre-release per branch, so the latest APK has a fixed download page
      - name: Publish branch pre-release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" app/build/outputs/apk/latestUniversal/release/*.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Test build ($GITHUB_REF_NAME)" \
            --notes "Automatic build of ${GITHUB_SHA::7} on branch $GITHUB_REF_NAME."

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/latestUniversal/release/*.apk --generate-notes
